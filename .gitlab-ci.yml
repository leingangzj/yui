# Yui CI — native unit tests only. The ESP32 build is too slow (~40 s
# plus a first-run toolchain download) to be worth running on every push;
# the local pre-push build covers it.

stages:
  - test

variables:
  PATH: "/root/.platformio/penv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

test:native:
  stage: test
  script:
    - pio --version
    - pio test -e native
  cache:
    key: pio-native
    paths:
      - .pio/
