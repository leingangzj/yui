; Yui — M5Cardputer ADV firmware
; https://github.com/leingangzj/yui

[platformio]
default_envs = native
src_dir = src
include_dir = include
test_dir = test

; ─────────────────────────────────────────────────────────────────────────────
; Common settings shared by device builds
; ─────────────────────────────────────────────────────────────────────────────
[env]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Iinclude

; ─────────────────────────────────────────────────────────────────────────────
; Cardputer ADV — real hardware
; ─────────────────────────────────────────────────────────────────────────────
[env:cardputer_adv]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    ${env.build_flags}
    -DYUI_TARGET_CARDPUTER_ADV=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
    ; Allow board/lib_extra/libnet80211.a (if dropped in by the operator)
    ; to override Espressif's blocked ieee80211_freedom_output, enabling
    ; native deauth TX. Harmless without the patched archive.
    -Wl,-zmuldefs
lib_extra_dirs =
    board/lib_extra
build_src_filter =
    +<*>
    -<hal/native/>
lib_deps =
    m5stack/M5GFX
    m5stack/M5Unified
    crankyoldgit/IRremoteESP8266
    links2004/WebSockets@^2.4.1
    jgromes/RadioLib@^7.1.0     ; CC1101 + nRF24 (Pingequa Hydra RF Cap 424)
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.flash_size = 8MB
extra_scripts =
    pre:tools/inject_version.py
    post:tools/post_build_push.py

; ─────────────────────────────────────────────────────────────────────────────
; Native — host-side unit tests, no Arduino, no hardware
; ─────────────────────────────────────────────────────────────────────────────
[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -DYUI_TARGET_NATIVE=1
    -DUNITY_INCLUDE_DOUBLE
build_src_filter =
    +<*>
    -<hal/esp32/>
    -<main.cpp>
test_framework = unity
